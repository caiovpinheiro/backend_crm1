name: Build & Deploy

# Job `checks` (lint + vitest) roda ANTES e é pré-requisito do build: sem
# ele, teste quebrado subia direto pra dev/prod.
#
# Buildamos a imagem no GitHub Actions (com cache persistente entre runs
# via `type=gha`), publicamos em ghcr.io e disparamos um webhook do
# Easypanel pra ele apenas fazer `docker pull` + restart. Deploy fim-a-fim
# cai de 5-10 min pra ~30-60s.
#
# Setup no GitHub (Settings -> Secrets and variables -> Actions):
#
# Mapeamento branch -> ambiente (atual):
#   main           -> PRODUÇÃO na DigitalOcean (157.245.121.18).
#                     Tags publicadas: `latest` E `digitalocean`.
#                     Webhooks disparados: EASYPANEL_WEBHOOK_DO_*
#   digitalocean   -> NÃO é mais gatilho (parada desde 26/08). O push numa
#                     branch roda o workflow DAQUELA branch: apague a branch
#                     remota ou proteja o nome para desarmar de vez.
#   qualquer outra -> ambiente dev. Tag `dev`, webhooks EASYPANEL_WEBHOOK_DEV_*
#
# Os secrets EASYPANEL_WEBHOOK_PROD* apontam para o EasyPanel do servidor
# ANTIGO (187.127.27.39) e NÃO são mais disparados por nenhuma branch — aquele
# host hoje só serve como fallback de storage. Foram mantidos cadastrados para
# rollback manual, não apague.
#
#   Secrets (por ambiente, uma por serviço — API + workers):
#     EASYPANEL_WEBHOOK_DO_API                  serviço API (produção DO)
#     EASYPANEL_WEBHOOK_DO_API_PUBLIC           api-public Bearer/n8n (opcional)
#     EASYPANEL_WEBHOOK_DO_WORKER_WHATSAPP      worker-whatsapp (produção DO)
#     EASYPANEL_WEBHOOK_DO_WORKER_LEADS         worker-leads (produção DO)
#     EASYPANEL_WEBHOOK_DO_WORKER_CAMPAIGNS     worker-campaigns (produção DO)
#     EASYPANEL_WEBHOOK_DO_WORKER_DISTRIBUTION  worker-distribution (produção DO, opcional)
#     EASYPANEL_WEBHOOK_DO_WORKER_ETL           worker-etl (produção DO)
#     EASYPANEL_WEBHOOK_DO_WORKER_AUTOMATIONS   worker-automations (produção DO)
#     EASYPANEL_WEBHOOK_DO_WORKER_META_WEBHOOK  worker-meta-webhook (produção DO)
#     EASYPANEL_WEBHOOK_PROD_BAILEYS            worker-baileys (produção DO)
#     EASYPANEL_WEBHOOK_PROD*                   servidor antigo — NÃO disparado
#     EASYPANEL_WEBHOOK_DEV                     serviço API (dev)
#     EASYPANEL_WEBHOOK_DEV_API_PUBLIC          api-public Bearer/n8n (opcional)
#     EASYPANEL_WEBHOOK_DEV_WORKER_WHATSAPP     worker-whatsapp (dev)
#     EASYPANEL_WEBHOOK_DEV_WORKER_LEADS        worker-leads (dev)
#     EASYPANEL_WEBHOOK_DEV_WORKER_CAMPAIGNS    worker-campaigns (dev)
#     EASYPANEL_WEBHOOK_DEV_WORKER_DISTRIBUTION worker-distribution (dev, opcional)
#     EASYPANEL_WEBHOOK_DEV_WORKER_ETL          worker-etl (dev)
#     EASYPANEL_WEBHOOK_DEV_WORKER_AUTOMATIONS  worker-automations (dev)
#     EASYPANEL_WEBHOOK_DEV_WORKER_META_WEBHOOK worker-meta-webhook (dev)
#     EASYPANEL_WEBHOOK_DEV_BAILEYS             worker-baileys (WhatsApp QR, dev)
#
#   Só a API é obrigatória. Webhooks de workers ausentes são ignorados —
#   assim dá pra adotar o rollout por partes (cadastra o secret quando o
#   serviço existir no Easypanel).
#
# Setup no Easypanel (por serviço):
#   Source: Docker Image
#   Image:  ghcr.io/caiovpinheiro/backend_crm1:latest        (prod DO)
#           ghcr.io/caiovpinheiro/backend_crm1:digitalocean  (prod DO, alias)
#           ghcr.io/caiovpinheiro/backend_crm1:dev           (dev)
#   `latest` e `digitalocean` recebem a MESMA imagem em todo push na main, então
#   tanto faz qual das duas o serviço referencia.
#   Registry credentials: crie um GitHub PAT com escopo `read:packages` e
#     cadastre em Easypanel -> Registries. (Se o pacote estiver public,
#     nao precisa autenticar.)
#   Deploy webhook: copie do Easypanel (Settings do servico -> Deployments
#     -> Deploy Hook) e coloque na secret correspondente ao serviço.
#
# O unico build arg e GIT_SHA (commit da imagem: vira ENV GIT_SHA,
# /app/BUILD_SHA e a label OCI `revision` — ver fim do Dockerfile).
# BACKEND_PUBLIC_URL, DATABASE_URL, META_APP_SECRET etc. sao configurados
# como envs runtime no Easypanel, nao no build.

on:
  push:
    branches: [main, DEV_BRANCH]
  workflow_dispatch:

# Cancela runs anteriores da mesma branch quando um push novo chega.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: caiovpinheiro/backend_crm1

jobs:
  # Portão antes do build/deploy: lint + testes. Antes disso o pipeline ia
  # direto pro `docker build`, então teste quebrado subia pra dev/prod.
  #
  # Ambos são BLOQUEANTES: `npm run lint` já sai 0 no repo (20 warnings,
  # 0 errors), então não precisa de `continue-on-error`. Se alguém
  # introduzir um error de lint, o deploy para — que é o objetivo.
  #
  # NÃO há step de typecheck: `tsc --noEmit` acusa ~143 erros pré-existentes
  # no repo (na maioria `select` do Prisma sem a coluna usada depois), então
  # um step de tsc nasceria vermelho. Não existe script `typecheck` no
  # package.json de propósito. Quando o passivo zerar, adicionar aqui.
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 24 (npm 11) = a versão que GEROU o package-lock.json, não a
          # do Dockerfile (node:22 / npm 10). Com npm 10 o `npm ci` aborta
          # com "Missing: esbuild@0.28.2 from lock file": o resolvedor do
          # npm 10 materializa outro `vite` para o vitest (a faixa é
          # ^6 || ^7 || ^8) e exige um esbuild que o lock — resolvido pelo
          # npm 11 para vite 8, que usa rolldown — não tem.
          #
          # O `docker build` não quebra com isso porque o Dockerfile tenta
          # `npm ci` e CAI PARA `npm install` numa cadeia de retries, ou
          # seja, a imagem pode estar sendo montada sem honrar o lock. Isso
          # é um problema à parte, anterior a este job.
          node-version: 24
          cache: npm

      # `postinstall` roda `prisma generate`, que precisa do DATABASE_URL
      # apenas RESOLVÍVEL (não conecta em banco nenhum) — daí a URL de
      # mentira. Nem lint nem os testes tocam o Postgres.
      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build-and-push:
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve environment
        id: env
        # Passar via `env:` (nao inline ${{ }}) e trim de \r\n protege
        # contra valores com Enter acidental colados no GitHub UI, que
        # quebravam o parser de $GITHUB_OUTPUT com "Invalid format".
        #
        # Monta uma LISTA de webhooks (um por serviço: API + workers) para
        # o step de redeploy disparar todos. Workers sem secret cadastrada
        # entram como string vazia e são pulados no step seguinte.
        env:
          BRANCH_REF: ${{ github.ref }}
          S_WEBHOOK_PROD: ${{ secrets.EASYPANEL_WEBHOOK_PROD }}
          S_WEBHOOK_PROD_WA: ${{ secrets.EASYPANEL_WEBHOOK_PROD_WORKER_WHATSAPP }}
          S_WEBHOOK_PROD_LEADS: ${{ secrets.EASYPANEL_WEBHOOK_PROD_WORKER_LEADS }}
          S_WEBHOOK_PROD_ETL: ${{ secrets.EASYPANEL_WEBHOOK_PROD_WORKER_ETL }}
          S_WEBHOOK_PROD_AUTO: ${{ secrets.EASYPANEL_WEBHOOK_PROD_WORKER_AUTOMATIONS }}
          S_WEBHOOK_PROD_META: ${{ secrets.EASYPANEL_WEBHOOK_PROD_WORKER_META_WEBHOOK }}
          S_WEBHOOK_PROD_BAILEYS: ${{ secrets.EASYPANEL_WEBHOOK_PROD_BAILEYS }}
          S_WEBHOOK_DEV: ${{ secrets.EASYPANEL_WEBHOOK_DEV }}
          S_WEBHOOK_DEV_PUBLIC: ${{ secrets.EASYPANEL_WEBHOOK_DEV_API_PUBLIC }}
          S_WEBHOOK_DEV_WA: ${{ secrets.EASYPANEL_WEBHOOK_DEV_WORKER_WHATSAPP }}
          S_WEBHOOK_DEV_LEADS: ${{ secrets.EASYPANEL_WEBHOOK_DEV_WORKER_LEADS }}
          S_WEBHOOK_DEV_CAMPAIGN: ${{ secrets.EASYPANEL_WEBHOOK_DEV_WORKER_CAMPAIGNS }}
          S_WEBHOOK_DEV_DIST: ${{ secrets.EASYPANEL_WEBHOOK_DEV_WORKER_DISTRIBUTION }}
          S_WEBHOOK_DEV_ETL: ${{ secrets.EASYPANEL_WEBHOOK_DEV_WORKER_ETL }}
          S_WEBHOOK_DEV_AUTO: ${{ secrets.EASYPANEL_WEBHOOK_DEV_WORKER_AUTOMATIONS }}
          S_WEBHOOK_DEV_META: ${{ secrets.EASYPANEL_WEBHOOK_DEV_WORKER_META_WEBHOOK }}
          S_WEBHOOK_DEV_BAILEYS: ${{ secrets.EASYPANEL_WEBHOOK_DEV_BAILEYS }}
          S_WEBHOOK_DO: ${{ secrets.EASYPANEL_WEBHOOK_DO_API }}
          S_WEBHOOK_DO_PUBLIC: ${{ secrets.EASYPANEL_WEBHOOK_DO_API_PUBLIC }}
          S_WEBHOOK_DO_WA: ${{ secrets.EASYPANEL_WEBHOOK_DO_WORKER_WHATSAPP }}
          S_WEBHOOK_DO_LEADS: ${{ secrets.EASYPANEL_WEBHOOK_DO_WORKER_LEADS }}
          S_WEBHOOK_DO_CAMPAIGN: ${{ secrets.EASYPANEL_WEBHOOK_DO_WORKER_CAMPAIGNS }}
          S_WEBHOOK_DO_DIST: ${{ secrets.EASYPANEL_WEBHOOK_DO_WORKER_DISTRIBUTION }}
          S_WEBHOOK_DO_ETL: ${{ secrets.EASYPANEL_WEBHOOK_DO_WORKER_ETL }}
          S_WEBHOOK_DO_AUTO: ${{ secrets.EASYPANEL_WEBHOOK_DO_WORKER_AUTOMATIONS }}
          S_WEBHOOK_DO_META: ${{ secrets.EASYPANEL_WEBHOOK_DO_WORKER_META_WEBHOOK }}
        run: |
          if [ "$BRANCH_REF" = "refs/heads/main" ]; then
            # Produção = DigitalOcean. Publica em DUAS tags (`latest` e
            # `digitalocean`) porque os serviços do EasyPanel da DO podem
            # referenciar qualquer uma das duas — os arquivos de deploy do repo
            # (deploy/digitalocean/*) apontam para `latest`, mas a branch de
            # migração publicava `digitalocean`. Publicar ambas torna o deploy
            # independente de qual tag está configurada no painel.
            #
            # Os webhooks EASYPANEL_WEBHOOK_PROD* (servidor antigo,
            # 187.127.27.39) NÃO são mais disparados: aquele host hoje serve
            # apenas como fallback de storage e não deve receber código novo.
            # As secrets continuam cadastradas de propósito, para eventual
            # rollback manual — só deixaram de ser chamadas automaticamente.
            TAG=latest
            EXTRA_TAG=digitalocean
            WEBHOOKS="api=$S_WEBHOOK_DO api-public=$S_WEBHOOK_DO_PUBLIC worker-whatsapp=$S_WEBHOOK_DO_WA worker-leads=$S_WEBHOOK_DO_LEADS worker-campaigns=$S_WEBHOOK_DO_CAMPAIGN worker-distribution=$S_WEBHOOK_DO_DIST worker-etl=$S_WEBHOOK_DO_ETL worker-automations=$S_WEBHOOK_DO_AUTO worker-meta-webhook=$S_WEBHOOK_DO_META worker-baileys=$S_WEBHOOK_PROD_BAILEYS"
          elif [ "$BRANCH_REF" = "refs/heads/digitalocean" ]; then
            # Branch de migração DO: publica com a tag da branch e dispara o
            # redeploy dos serviços do EasyPanel da DO (API + workers).
            TAG=digitalocean
            WEBHOOKS="api=$S_WEBHOOK_DO api-public=$S_WEBHOOK_DO_PUBLIC worker-whatsapp=$S_WEBHOOK_DO_WA worker-leads=$S_WEBHOOK_DO_LEADS worker-campaigns=$S_WEBHOOK_DO_CAMPAIGN worker-distribution=$S_WEBHOOK_DO_DIST worker-etl=$S_WEBHOOK_DO_ETL worker-automations=$S_WEBHOOK_DO_AUTO worker-meta-webhook=$S_WEBHOOK_DO_META worker-baileys=$S_WEBHOOK_PROD_BAILEYS"
          else
            TAG=dev
            WEBHOOKS="api=$S_WEBHOOK_DEV api-public=$S_WEBHOOK_DEV_PUBLIC worker-whatsapp=$S_WEBHOOK_DEV_WA worker-leads=$S_WEBHOOK_DEV_LEADS worker-campaigns=$S_WEBHOOK_DEV_CAMPAIGN worker-distribution=$S_WEBHOOK_DEV_DIST worker-etl=$S_WEBHOOK_DEV_ETL worker-automations=$S_WEBHOOK_DEV_AUTO worker-meta-webhook=$S_WEBHOOK_DEV_META worker-baileys=$S_WEBHOOK_DEV_BAILEYS"
          fi
          TAG=$(printf '%s' "$TAG" | tr -d '\r\n')
          EXTRA_TAG=$(printf '%s' "${EXTRA_TAG:-}" | tr -d '\r\n')
          # Normaliza: trim de \r\n por webhook e descarta serviços sem secret.
          # Saída = lista separada por espaço de `serviço|url`, um item por
          # serviço configurado (o nome aparece no log e no resumo do run).
          CLEAN=""
          COUNT=0
          for w in $WEBHOOKS; do
            w=$(printf '%s' "$w" | tr -d '\r\n')
            case "$w" in *=*) ;; *) continue ;; esac
            name=${w%%=*}
            url=${w#*=}
            [ -z "$url" ] && continue
            CLEAN="$CLEAN $name|$url"
            COUNT=$((COUNT+1))
          done
          CLEAN=$(printf '%s' "$CLEAN" | sed 's/^ //')
          # Lista final de refs de imagem (uma por linha) consumida direto pelo
          # build-push-action — evita linha vazia quando não há EXTRA_TAG.
          IMAGE_REFS="$REGISTRY/$IMAGE_NAME:$TAG"$'\n'"$REGISTRY/$IMAGE_NAME:$GITHUB_SHA"
          if [ -n "$EXTRA_TAG" ]; then
            IMAGE_REFS="$IMAGE_REFS"$'\n'"$REGISTRY/$IMAGE_NAME:$EXTRA_TAG"
          fi
          {
            echo "TAG=$TAG"
            echo "EXTRA_TAG=$EXTRA_TAG"
            echo "WEBHOOKS=$CLEAN"
            echo "IMAGE_REFS<<__EOF__"
            echo "$IMAGE_REFS"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "::group::env resolved (values masked)"
          [ -n "$TAG" ] && echo "TAG=$TAG" || echo "TAG=<EMPTY>"
          if [ -n "$EXTRA_TAG" ]; then echo "EXTRA_TAG=$EXTRA_TAG"; fi
          echo "WEBHOOKS_COUNT=$COUNT"
          echo "::endgroup::"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Em `main` a lista traz `latest` + `digitalocean` + sha (ver step
          # "Resolve environment"); nas outras branches, só a tag da branch + sha.
          tags: ${{ steps.env.outputs.IMAGE_REFS }}
          # Commit real da imagem (antes o GIT_SHA era um valor fixo, igual
          # em todos os serviços). O ARG fica no fim do Dockerfile: não
          # invalida o cache das camadas pesadas.
          build-args: |
            GIT_SHA=${{ github.sha }}
          # Scope por branch + fallback pra main: builds de DEV_BRANCH
          # aproveitam camadas ja cacheadas por main quando o proprio
          # cache esta frio (antes DEV rodava ~5min vs 2min em main).
          cache-from: |
            type=gha,scope=${{ github.ref_name }}
            type=gha,scope=main
          cache-to: type=gha,scope=${{ github.ref_name }},mode=max

      - name: Trigger Easypanel redeploy
        if: steps.env.outputs.WEBHOOKS != ''
        timeout-minutes: 15
        # A imagem já está no GHCR. Se algum serviço não receber o redeploy, o
        # run FICA VERMELHO (antes era `continue-on-error` + aviso amarelo, e em
        # 07/11 o DEV ficou com código velho sem ninguém perceber: os 7 webhooks
        # deram "Connection timed out" por ~3 min e o run saiu verde).
        # Para refazer: "Re-run failed jobs" neste run (o build sai do cache)
        # ou Deploy manual no painel dos serviços listados no resumo.
        #
        # Retry em RODADAS com backoff (0, 15, 30, 60, 90, 120 s): a cada rodada
        # tenta só os serviços pendentes. Se a conexão nem abre (EasyPanel fora
        # do ar ou inalcançável), os demais da rodada são adiados sem gastar um
        # connect-timeout cada — todos estão no mesmo painel.
        env:
          SERVICES: ${{ steps.env.outputs.WEBHOOKS }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.env.outputs.TAG }}
        run: |
          PENDING="$SERVICES"
          TOTAL=$(echo $SERVICES | wc -w)
          ROUND=0
          for WAIT in 0 15 30 60 90 120; do
            [ -z "$PENDING" ] && break
            ROUND=$((ROUND+1))
            if [ "$WAIT" -gt 0 ]; then
              echo "Aguardando ${WAIT}s antes da rodada $ROUND..."
              sleep "$WAIT"
            fi
            echo "── Rodada $ROUND ──"
            NEXT=""
            UNREACHABLE=0
            for ITEM in $PENDING; do
              NAME=${ITEM%%|*}
              URL=${ITEM#*|}
              if [ "$UNREACHABLE" = "1" ]; then
                NEXT="$NEXT $ITEM"
                continue
              fi
              # --connect-timeout: falha rápido se o host não responder.
              # --max-time: NUNCA pendura — o EasyPanel mantém a conexão aberta
              #   transmitindo o deploy, então limitamos o tempo de leitura.
              # stderr descartado: a mensagem do curl pode citar o host do
              #   webhook; o código de saída já diz o que houve.
              out=$(curl -sS -o /dev/null \
                -w "%{http_code} %{exitcode} %{time_connect}" \
                --connect-timeout 10 --max-time 45 \
                -X POST "$URL" \
                -H "User-Agent: github-actions/backend_crm1" 2>/dev/null) || true
              code=$(printf '%s' "$out" | awk '{print $1}')
              ex=$(printf '%s' "$out" | awk '{print $2}')
              tconn=$(printf '%s' "$out" | awk '{print $3}')
              connected=1
              case "${tconn:-0}" in 0|0.0|0.000000) connected=0 ;; esac
              case "$code" in
                2*)
                  echo "  $NAME: redeploy aceito (HTTP $code)."
                  continue ;;
              esac
              # Timeout de LEITURA após conectar: o EasyPanel já RECEBEU o POST
              # e faz o redeploy de forma assíncrona.
              if [ "$ex" = "28" ] && [ "$connected" = "1" ]; then
                echo "  $NAME: timeout de leitura após envio — redeploy disparado (assíncrono)."
                continue
              fi
              echo "  $NAME: falhou (HTTP ${code:-000}, curl exit ${ex:-?}, connect ${tconn:-?}s)."
              if [ "$connected" = "0" ]; then
                echo "  EasyPanel inalcançável — demais serviços adiados para a próxima rodada."
                UNREACHABLE=1
                # Vai para o FIM da fila: se o problema for só o host deste
                # webhook, a próxima rodada começa por outro serviço.
                LAST="$ITEM"
              else
                NEXT="$NEXT $ITEM"
              fi
            done
            PENDING=$(echo $NEXT ${LAST:-})
            LAST=""
          done

          if [ -z "$PENDING" ]; then
            echo "Todos os $TOTAL serviço(s) dispararam redeploy."
            exit 0
          fi

          MISSING=""
          for ITEM in $PENDING; do MISSING="$MISSING ${ITEM%%|*}"; done
          MISSING=$(echo $MISSING)
          COUNT=$(echo $MISSING | wc -w)
          echo "::error title=Redeploy não disparado::$IMAGE foi publicada, mas o EasyPanel não recebeu o redeploy de $COUNT de $TOTAL serviço(s): $MISSING. Use 'Re-run failed jobs' neste run ou faça Deploy manual desses serviços no painel."
          {
            echo "### ❌ Redeploy não disparado"
            echo ""
            echo "A imagem \`$IMAGE\` foi publicada, mas o EasyPanel não recebeu o redeploy de **$COUNT de $TOTAL** serviço(s) após $ROUND rodada(s):"
            echo ""
            for NAME in $MISSING; do echo "- \`$NAME\`"; done
            echo ""
            echo "Esses serviços seguem com a imagem anterior. Para corrigir: **Re-run failed jobs** neste run (o build sai do cache) ou **Deploy** manual de cada um no painel."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
